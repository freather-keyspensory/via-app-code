on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [definition_update]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Build and deploy VIA
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        run: bun install

      - name: Checkout keyboard definitions
        uses: actions/checkout@v4
        with:
          repository: freather-keyspensory/via-keyboards
          ref: master
          path: via-keyboards-src

      - name: Install keyboard definition dependencies
        working-directory: via-keyboards-src
        run: bun install

      - name: Build keyboard definitions
        working-directory: via-keyboards-src
        run: bun run build

      - name: Copy keyboard definitions
        run: |
          rm -rf public/definitions
          cp -R via-keyboards-src/dist public/definitions

      - name: Build VIA for /via/
        run: bun run build

      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: freather-keyspensory/freather-keyspensory.github.io
          ref: main
          token: ${{ secrets.SITE_DEPLOY_TOKEN }}
          path: website

      - name: Update website /via
        run: |
          rm -rf website/via
          mkdir -p website/via
          cp -R dist/. website/via/

      - name: Publish website
        working-directory: website
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add via
          if git diff --cached --quiet; then
            echo "No VIA changes to publish."
            exit 0
          fi
          git commit -m "Update VIA configurator"
          git push origin main
